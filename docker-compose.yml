services:
  postgres:
    image: postgres:16-alpine
    container_name: hexbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexbank
      POSTGRES_USER: hexbank
      POSTGRES_PASSWORD: hexbank123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexbank -d hexbank"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: